# <template-only>
# =============================================================================
# TEMPLATE SETUP NOTES -- template-only: scripts/template_sync.py never ships it
# =============================================================================
# This .pre-commit-config.yaml is part of a starter repo scaffold.
# pre-commit runs a suite of checks automatically on every
# git commit, catching lint errors, formatting issues, type errors, and
# accidentally committed secrets before they reach the repo.
#
# First-time setup (run once after cloning):
#   uv run pre-commit install                         # commit-time hooks
#   uv run pre-commit install --hook-type pre-push    # pre-push hooks
#   uv run pre-commit run --all-files                 # optional: check now
#
# Every hook runs from the project's venv (`uv run`), so each tool's version
# comes from uv.lock, not from a rev: pin here. `uv lock --upgrade`, or the
# Dependabot uv updates, keep them current; this file names no versions.
#
# Commit-time hooks (run on every `git commit`):
#   pre-commit-hooks  -- trailing whitespace, EOF newline, YAML/TOML syntax,
#                        large file guard, line-ending normalization
#   ruff              -- lint (with --fix) and format
#   mypy              -- static type checking across src/ and tests/
#   mypy-stub-guard   -- blocks [tool.mypy] overrides that silence imports
#                        whose type stubs are published on PyPI (install the
#                        types-* package instead); runs when pyproject.toml
#                        is staged
#   detect-secrets    -- prevents secrets from being committed; runs from the
#                        project venv (dev dependency, version from uv.lock)
#                        through tests/detect_secrets_hook.py, which makes it
#                        update the baseline on Windows the way CI does.
#                        Requires a baseline file; create it once with:
#                          uv run detect-secrets scan > .secrets.baseline
#   secrets-baseline-audited
#                     -- fails the commit if any .secrets.baseline entry has
#                        not been audited as a false positive (blocks blindly
#                        regenerated baselines from smuggling a real secret
#                        past the detect-secrets hook); fix with:
#                          uv run detect-secrets audit .secrets.baseline
#   no-inline-secret-suppressions
#                     -- fails the commit if any file in the repo contains an
#                        inline detect-secrets suppression pragma (runs the
#                        enforcement test against the whole working tree)
#   template-validate -- (this template repo only) runs
#                        `uv run scripts/template_sync.py validate`: every
#                        tracked file classified in template.toml, markers
#                        balanced, features and tokens valid
#
# Pre-push hooks (run once on `git push`, slower whole-repo gates):
#   uv-lock-check     -- fails if uv.lock is out of sync with pyproject.toml
#   uv-audit          -- fails on known-vulnerable dependencies (needs network)
#   vulture           -- fails on dead code (unused functions, classes,
#                        variables); paths and ignored names are set in
#                        pyproject.toml [tool.vulture]
#   pytest-prepush    -- runs the pre-push test suite
#                        (`-m "not live and not slow and not destructive_local
#                        and not destructive_remote"`)
# =============================================================================
# </template-only>

# .pre-commit-config.yaml

# configure pre-commit checks
# install uv: https://docs.astral.sh/uv/
# uv sync
# uv run pre-commit install
# uv run pre-commit install --hook-type pre-push
# Every hook runs through `uv run`: its version is the one in uv.lock.

default_stages: [pre-commit]

repos:
  # Generic hygiene, from the pre-commit-hooks package (a dev dependency)
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run end-of-file-fixer
        language: system
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: uv run check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: uv run check-toml
        language: system
        types: [toml]
      - id: check-added-large-files
        name: check for added large files
        entry: uv run check-added-large-files
        language: system
      - id: mixed-line-ending
        name: mixed line ending
        entry: uv run mixed-line-ending --fix=lf  # for cross-platform support
        language: system
        types: [text]

  # detect-secrets
  - repo: local
    hooks:
      # The wrapper fixes path matching on Windows, where the plain hook keeps
      # baseline entries for files with no secrets left and CI then fails.
      # Serial: parallel batches each rewrite the baseline and the last one wins.
      - id: detect-secrets
        name: Detect secrets
        entry: uv run python tests/detect_secrets_hook.py --baseline .secrets.baseline
        language: system
        require_serial: true

      # The hook above only checks that findings are *in* the baseline; this
      # gate requires every entry to be an audited false positive, so a
      # blindly regenerated baseline cannot smuggle a real secret into a
      # commit (and therefore into pushed history).
      - id: secrets-baseline-audited
        name: secrets baseline audited
        entry: uv run pytest tests/test_secrets_baseline_audited.py --no-cov -q
        language: system
        pass_filenames: false
        always_run: true

  # Ruff: lint + format
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  # Mypy type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # Block mypy overrides that silence imports with published type stubs
      - id: mypy-stub-guard
        name: mypy stub guard
        entry: uv run pytest tests/test_mypy_stub_guard.py --no-cov -q
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false

  # Block inline secret-scanner suppressions at commit time
  - repo: local
    hooks:
      - id: no-inline-secret-suppressions
        name: no inline secret suppressions
        entry: uv run pytest tests/test_no_inline_suppressions_for_secrets.py --no-cov -q
        language: system
        pass_filenames: false
        always_run: true

  # <template-only>
  # Template self-check: an unclassified file or a broken marker cannot be
  # committed.
  - repo: local
    hooks:
      - id: template-validate
        name: template validate
        entry: uv run scripts/template_sync.py validate
        language: system
        pass_filenames: false
        always_run: true
  # </template-only>

  # Pre-push checks
  - repo: local
    hooks:
      # uv lock file verification
      - id: uv-lock-check
        name: uv lock --locked
        entry: uv lock --locked
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # dependency vulnerability checking
      - id: uv-audit
        name: uv audit
        entry: uv audit
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # dead code checking
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # run non-slow, non-live pytest
      - id: pytest-prepush
        name: pytest (prepush)
        entry: >-
          uv run pytest -m
          "not live and not slow and not destructive_local and not destructive_remote"
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
