# =============================================================================
# TEMPLATE SETUP NOTES -- remove this block when you use this template
# =============================================================================
# This .pre-commit-config.yaml is part of python_repo_template, a starter
# repo scaffold. pre-commit runs a suite of checks automatically on every
# git commit, catching lint errors, formatting issues, type errors, and
# accidentally committed secrets before they reach the repo.
#
# First-time setup (run once after cloning):
#   uv run pre-commit install                         # commit-time hooks
#   uv run pre-commit install --hook-type pre-push    # pre-push hooks
#   uv run pre-commit run --all-files                 # optional: check now
#
# To keep hook versions current:
#   uv run pre-commit autoupdate       # bump all rev: pins to latest
#
# Commit-time hooks (run on every `git commit`):
#   pre-commit-hooks  -- trailing whitespace, EOF newline, YAML/TOML syntax,
#                        large file guard, line-ending normalization
#   ruff              -- lint (with --fix) and format
#   mypy              -- static type checking across src/ and tests/
#   mypy-stub-guard   -- blocks [tool.mypy] overrides that silence imports
#                        whose type stubs are published on PyPI (install the
#                        types-* package instead); runs when pyproject.toml
#                        is staged
#   detect-secrets    -- prevents secrets from being committed; requires a
#                        baseline file (.secrets.baseline). Create it once with:
#                          uv run detect-secrets scan > .secrets.baseline
#
# Pre-push hooks (run once on `git push`, slower whole-repo gates):
#   uv-lock-check     -- fails if uv.lock is out of sync with pyproject.toml
#   uv-audit          -- fails on known-vulnerable dependencies (needs network)
#   pytest-prepush    -- runs the pre-push test suite
#                        (`-m "not live and not slow and not destructive_local
#                        and not destructive_remote"`)
# =============================================================================

# .pre-commit-config.yaml

# configure pre-commit checks
# install uv: https://docs.astral.sh/uv/
# uv sync
# uv run pre-commit install
# uv run pre-commit install --hook-type pre-push
# uv run pre-commit autoupdate

default_language_version:
  python: python3.14

default_stages: [pre-commit]

ci:
  autoupdate_schedule: monthly

repos:
  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]  # for cross-platform support

  # detect-secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  # Ruff: lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Mypy type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # Block mypy overrides that silence imports with published type stubs
      - id: mypy-stub-guard
        name: mypy stub guard
        entry: uv run pytest tests/test_mypy_stub_guard.py --no-cov -q
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false

  # Pre-push checks
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --locked
        entry: uv lock --locked
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: uv-audit
        name: uv audit
        entry: uv audit
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: pytest-prepush
        name: pytest (prepush)
        entry: uv run pytest -m "not live and not slow and not destructive_local and not destructive_remote"
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
