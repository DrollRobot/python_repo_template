# =============================================================================
# TEMPLATE SETUP NOTES -- remove this block when you use this template
# =============================================================================
# This .pre-commit-config.yaml is part of python_repo_template, a starter
# repo scaffold. pre-commit runs a suite of checks automatically on every
# git commit, catching lint errors, formatting issues, type errors, and
# accidentally committed secrets before they reach the repo.
#
# First-time setup (run once after cloning):
#   uv run pre-commit install          # install the git hook
#   uv run pre-commit run --all-files  # optional: check existing files now
#
# To keep hook versions current:
#   uv run pre-commit autoupdate       # bump all rev: pins to latest
#
# Hooks included in this config:
#   pre-commit-hooks  -- trailing whitespace, EOF newline, YAML/TOML syntax,
#                        large file guard, line-ending normalization
#   ruff              -- lint (with --fix) and format
#   mypy              -- static type checking across src/ and tests/
#   detect-secrets    -- prevents secrets from being committed; requires a
#                        baseline file (.secrets.baseline). Create it once with:
#                          uv run detect-secrets scan > .secrets.baseline
# =============================================================================

default_language_version:
  python: python3.14

ci:
  autoupdate_schedule: monthly

repos:
  # Generic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]  # since you work cross-platform

  # Ruff: lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Mypy type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src, tests]

  # detect-secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
