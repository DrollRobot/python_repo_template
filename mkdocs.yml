# mkdocs.yml -- the template's own docs site. Projects get child/mkdocs.yml.
site_name: python-repo-template
site_description: A Python project template whose projects stay in sync with it
site_url: https://drollrobot.github.io/python_repo_template/
repo_url: https://github.com/DrollRobot/python_repo_template

theme:
  name: material
  features:
    - navigation.sections     # collapsible sections in left nav
    - navigation.expand       # expand all by default
    - content.code.copy       # copy button on code blocks
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Staying in sync: staying-in-sync.md
  - Config system: config-system.md
  - Private dependencies: private-dependencies.md
  - Container job: container-job.md
  - Changing the template: changing-the-template.md

markdown_extensions:
  - admonition                # !!! note style callouts
  - pymdownx.superfences      # fenced code with language detection
  - pymdownx.highlight        # syntax highlighting
  - pymdownx.inlinehilite     # inline `code` highlighting
  - toc:
      permalink: true         # anchor link on each heading

plugins:
  - search
