[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv_build]
package-data = { python_repo_template = ["py.typed"] }

[project]
name = "python-repo-template"
version = "1.9.0"
description = "" # FIXME add a brief description of the project
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # FIXME add depencencies
]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings[python]>=1.0.5,<2",
]
keyvault = [
    # Azure KeyVault backend (opt-in). To remove: delete this group, and the
    # dev include-group below
    "azure-identity>=1.17,<2",
    "azure-keyvault-secrets>=4.8,<5",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1,<8",
    "python-dotenv>=1.2.2,<2",
    "tomli>=2.0.1; python_version < '3.11'",  # stdlib tomllib backport for 3.10
]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    {include-group = "keyvault"},
    "debugpy>=1.8,<2",
    "keyring>=25.0,<26",  # credentials feature (keyring backend)
    "mypy>=2.2.0,<3",
    "pre-commit>=4.6,<5",
    "ruff>=0.15.21,<1",
    #"other-project", # FIXME add any local/github dependencies here, or remove if not needed
]

[tool.uv.sources]
# FIXME add any local/github dependencies here.
# other-project = { git = "https://github.com/USERNAME/other-project.git", tag = "v1.2.3" }
# other-project = { path = "/PATH/TO/PROJECT", editable = true }

[project.scripts]
# python-repo-template = "python_repo_template.main:cli" # FIXME add a CLI entry point if needed

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=python_repo_template",
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-fail-under=0", # FIXME: the test coverage gate is disabled for template. set to 80? 90?
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "integration: requires a populated .env (network/credentials)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W = pycodestyle, D = pydocstyle, F = pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, S = security (bandit), SIM = simplify, RUF = ruff-specific,
# PT = pytest style, ANN = annotations
select = ["E", "D", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ANN"]
extend-ignore = ["ANN401"]  # Any in **kwargs is a legitimate pass-through annotation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]  # no docstrings/annotations in tests; assert is fine

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = ["scripts", "scripts/template_setup"]

# [[tool.mypy.overrides]] # FIXME add if imports don't provide type hints and throw mypy errors
# module = [""]
# ignore_missing_imports = true
