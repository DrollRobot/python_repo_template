[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv_build]
package-data = { python_repo_template = ["py.typed"] }

[project]
name = "python-repo-template"
version = "1.12.0"
description = "" # FIXME add a brief description of the project
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # FIXME add depencencies
    "platformdirs>=4.3,<5",  # config feature: OS-standard config.toml location
    # keyring credential backend (default). To remove: delete this line and
    # src/python_repo_template/config/keyring_backend.py.
    "keyring>=25.0,<26",
]

[project.optional-dependencies]
keyvault = [
    # Azure Key Vault credential backend (opt-in, read-only). To remove: delete
    # this extra, src/python_repo_template/config/keyvault_backend.py, and the
    # azure lines in the dev group below.
    "azure-identity>=1.17,<2",
    "azure-keyvault-secrets>=4.8,<5",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings[python]>=1.0.4,<2",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1,<8",
    "python-dotenv>=1.2.2,<2",
    "tomli>=2.0.1; python_version < '3.11'",  # stdlib tomllib backport for 3.10
]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    # Key Vault backend for contributors; keep in sync with the 'keyvault'
    # extra above (delete both together).
    "azure-identity>=1.17,<2",
    "azure-keyvault-secrets>=4.8,<5",
    "debugpy>=1.8,<2",
    "mypy>=2.1,<3",
    "pre-commit>=4.6,<5",
    "ruff>=0.15,<1",
    #"other-project", # FIXME add any local/github dependencies here, or remove if not needed
]

[tool.uv.sources]
# FIXME add any local/github dependencies here.
# other-project = { git = "https://github.com/USERNAME/other-project.git", tag = "v1.2.3" }
# other-project = { path = "/PATH/TO/PROJECT", editable = true }

[project.scripts]
python-repo-template = "python_repo_template.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=python_repo_template",
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-fail-under=0", # FIXME: coverage disabled for template. update for your project.
    "--strict-markers",
    "--strict-config",
]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    # Scope
    "unit: single function/class in isolation; all dependencies mocked or stubbed",
    "integration: multiple real components wired together across a boundary",
    "e2e: whole application end to end, driven like a real user",
    # Purpose
    "smoke: fast 'is it fundamentally broken' check",
    "regression: guards against reintroduction of a previously fixed bug",
    "acceptance: verifies behavior against a requirement or user-facing spec",
    "functional: tests behavior/output of a feature without regard to internal structure",
    # Dependency
    "live: requires a real external resource (network, live tenant, secrets, third-party API)",
    "destructive_local: mutates the host/device; guarded to prevent accidental execution",
    "destructive_remote: mutates a remote/external system; guarded to prevent accidental execution",
    # Performance
    "slow: long-running",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W = pycodestyle, D = pydocstyle, F = pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, S = security (bandit), SIM = simplify, RUF = ruff-specific,
# PT = pytest style, ANN = annotations
select = ["E", "D", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ANN"]
extend-ignore = ["ANN401"]  # Any in **kwargs is a legitimate pass-through annotation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]  # no docstrings/annotations in tests; assert is fine

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts", ".claude/hooks"]
mypy_path = ["scripts", "scripts/template_setup"]

# [[tool.mypy.overrides]] # FIXME add if imports don't provide type hints and throw mypy errors
# module = [""]
# ignore_missing_imports = true
