[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[project]
name = "python-repo-template"
version = "1.0.0"
description = "" # FIXME add a brief description of the project
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # FIXME add depencencies
]

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings[python]>=1.0,<2",
]
test = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.1,<8",
    "python-dotenv>=1.2,<2",
]
keyvault = [
    "azure-identity>=1.17,<2",
    "azure-keyvault-secrets>=4.8,<5",
]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    # {include-group = "keyvault"}, # FIXME uncomment if using keyvault for secrets
    "debugpy>=1.8,<2",
    "keyring>=25.0,<26",
    "mypy>=2.1,<3",
    "pre-commit>=4.6,<5",
    "ruff>=0.15,<1",
]

[tool.uv_build]
package-data = { python_repo_template = ["py.typed"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=python_repo_template --cov-report=term-missing --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W = pycodestyle, D = pydocstyle, F = pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, S = security (bandit), SIM = simplify, RUF = ruff-specific,
# PT = pytest style, ANN = annotations
select = ["E", "D", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ANN"]
extend-ignore = ["ANN401"]  # Any in **kwargs is a legitimate pass-through annotation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101"]  # no docstrings/annotations in tests; assert is fine

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
