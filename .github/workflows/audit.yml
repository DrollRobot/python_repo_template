# =============================================================================
# TEMPLATE SETUP NOTES -- remove this block when you use this template
# =============================================================================
# This audit.yml is part of python_repo_template, a starter repo scaffold.
#
# Purpose: Runs `uv audit` on every push and pull request to main, checking
# all locked dependencies against the OSV vulnerability database. Blocks
# merges if any known vulnerability is found in the dependency tree.
#
# No customization is required. To suppress a false positive, add a
# pyproject.toml [tool.uv.audit] ignore entry with a justification comment.
# =============================================================================

# .github/workflows/audit.yml

name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.x"

      # - name: Mint a token for private git deps # FIXME uncomment if using Github app tokens to access private repos
      #   id: app-token
      #   uses: actions/create-github-app-token@v2   # pin to a SHA in practice
      #   with:
      #     app-id: ${{ vars.GRAPH_AUTH_APP_ID }}
      #     private-key: ${{ secrets.GRAPH_AUTH_APP_PRIVATE_KEY }}
      #     owner: ${{ github.repository_owner }}
      #     repositories: repo1

      # - name: Authenticate git to private deps
      #   run: |
      #     git config --global \
      #       url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf \
      #       "https://github.com/"

      - name: Sync dependencies
        run: uv sync --locked --all-groups


      - name: Audit dependencies
        run: uv audit
