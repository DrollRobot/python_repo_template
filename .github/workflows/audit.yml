# =============================================================================
# TEMPLATE SETUP NOTES -- remove this block when you use this template
# =============================================================================
# This audit.yml is part of python_repo_template, a starter repo scaffold.
#
# Purpose: Runs `uv audit` on every push and pull request to main, checking
# all locked dependencies against the OSV vulnerability database. Blocks
# merges if any known vulnerability is found in the dependency tree.
#
# No customization is required. To suppress a false positive, add a
# pyproject.toml [tool.uv.audit] ignore entry with a justification comment.
# =============================================================================

# .github/workflows/audit.yml

name: Security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.x"

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Audit dependencies
        run: uv audit
