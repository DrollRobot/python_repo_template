# <template-only>
# =============================================================================
# TEMPLATE SETUP NOTES -- template-only: scripts/template_sync.py never ships it
# =============================================================================
# This audit.yml is part of a starter repo scaffold.
#
# Purpose: Runs the security gates on every push to any branch and on every
# pull request to main.
#
#   audit       -- `uv audit` checks all locked dependencies against the OSV
#                  vulnerability database.
#   secret-scan -- detect-secrets scans every tracked file, and enforces that
#                  every .secrets.baseline entry is an audited false positive.
#
# GitHub setup (one-time, to make these gates actually block merges):
#   1. Push this file so the workflow runs at least once.
#   2. Settings -> Branches -> branch protection rule for main.
#   3. Under "Require status checks to pass before merging", add both the
#      "audit" and "secret-scan" statuses.
#
# Without branch protection these jobs report pass/fail but do not prevent
# merging. To suppress a dependency false positive, add a pyproject.toml
# [tool.uv.audit] ignore entry with a justification comment.
# =============================================================================
# </template-only>

# .github/workflows/audit.yml

name: Security audit
run-name: Audit on ${{ github.ref_name }} ${{ github.event_name }} by @${{ github.actor }}

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.13.x"

      # <template-only feature="private_repo_deps">
      - name: Mint a token for private git deps
        id: app-token
        if: ${{ vars.GH_APP_CLIENT_ID != '' }}
        # pin the app token action to a specific commit. list version commits:
        # git ls-remote --tags https://github.com/actions/create-github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: "" #FIXME github owner of private dependencies
          repositories: private-repo-1, private-repo-2 #FIXME list private dependencies

      - name: Authenticate git to private deps
        if: ${{ steps.app-token.outputs.token != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      # </template-only>

      - name: Sync dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Audit dependencies
        run: uv audit

  # Secret scanning.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.13.x"

      - name: Sync detect-secrets
        run: uv sync --locked --only-group secrets

      - name: Scan tracked files for new secrets
        run: |
          git ls-files -z | xargs -0 -r \
            uv run --no-sync detect-secrets-hook --baseline .secrets.baseline

      - name: Require every baseline entry to be an audited false positive
        run: |
          uv run --no-sync detect-secrets audit --report .secrets.baseline > secrets-report.json
          python3 - <<'PY'
          import json
          import sys

          with open("secrets-report.json", encoding="utf-8") as handle:
              results = json.load(handle)["results"]

          unresolved = [r for r in results if r["category"] != "VERIFIED_FALSE"]
          for entry in unresolved:
              types = ", ".join(entry["types"])
              print(
                  f"::error file={entry['filename']}::{entry['category']}: {types}. "
                  "Audit it with `uv run detect-secrets audit .secrets.baseline` "
                  "and remove the secret if it is real."
              )

          if unresolved:
              sys.exit(1)

          print(f"{len(results)} baseline entries, all audited as false positives.")
          PY
