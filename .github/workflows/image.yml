# .github/workflows/image.yml

name: Image
run-name: Image on ${{ github.ref_name }} ${{ github.event_name }} by @${{ github.actor }}

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  IMAGE: ${{ github.event.repository.name }}:ci
  PUBLISH: ${{ github.ref == 'refs/heads/main' && vars.ACR_NAME != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the Python version
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      # <template-only feature="private_repo_deps">
      - name: Mint a token for private git deps
        id: app-token
        if: ${{ vars.GH_APP_CLIENT_ID != '' }}
        # pin the app token action to a specific commit. list version commits:
        # git ls-remote --tags https://github.com/actions/create-github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: "" #FIXME github owner of private dependencies
          repositories: private-repo-1, private-repo-2 #FIXME list private dependencies
      # </template-only>

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: PYTHON_VERSION=${{ steps.python.outputs.version }}
          load: true
          tags: ${{ env.IMAGE }}
          # <template-only feature="private_repo_deps">
          secrets: ${{ steps.app-token.outputs.token && format('gh_token={0}', steps.app-token.outputs.token) || '' }}
          # </template-only>

      - name: Smoke test the entrypoint
        # --help imports every module, so a missing dependency fails here.
        run: docker run --rm "$IMAGE" --help

      # <template-only feature="private_repo_deps">
      - name: Check the image holds no GitHub token
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if docker history --no-trunc "$IMAGE" | grep -qF "$GH_TOKEN"; then
            echo "::error::The GitHub token is in the image history."
            exit 1
          fi
          if docker run --rm --user root -e T="$GH_TOKEN" --entrypoint sh "$IMAGE" -c \
              'grep -rlF "$T" / --exclude-dir=proc --exclude-dir=sys --exclude-dir=dev 2>/dev/null'; then
            echo "::error::The GitHub token is in the image's files (listed above)."
            exit 1
          fi
      # </template-only>

      - name: Read the package version
        if: env.PUBLISH == 'true'
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure
        if: env.PUBLISH == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push the image
        if: env.PUBLISH == 'true'
        id: push
        env:
          REGISTRY: ${{ vars.ACR_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          az acr login --name "$REGISTRY"
          repository="$REGISTRY.azurecr.io/${{ github.event.repository.name }}"
          # A rebuild keeps the release's version and commit tags on the release build.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            tags="$GITHUB_SHA-$(date -u +%Y%m%d)"
          else
            tags="$VERSION $GITHUB_SHA"
          fi
          for tag in $tags; do
            docker tag "$IMAGE" "$repository:$tag"
            docker push "$repository:$tag"
          done
          echo "deploy_tag=${tags##* }" >> "$GITHUB_OUTPUT"

      - name: Point the job at the new image
        if: env.PUBLISH == 'true'
        env:
          REGISTRY: ${{ vars.ACR_NAME }}
          JOB: ${{ vars.CONTAINER_APP_JOB }}
          RESOURCE_GROUP: ${{ vars.CONTAINER_APP_RESOURCE_GROUP }}
          TAG: ${{ steps.push.outputs.deploy_tag }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp job update --name "$JOB" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/${{ github.event.repository.name }}:$TAG" \
            --only-show-errors --query properties.template.containers[0].image -o tsv
