# <template-only>
# =============================================================================
# TEMPLATE SETUP NOTES -- template-only: scripts/template_sync.py never ships it
# =============================================================================
# This ci.yml is part of a starter repo scaffold.
#
# Purpose: Runs on every push to any branch and on every pull request to main,
# on Ubuntu and Windows. Blocks merges if lint, formatting, type checking, dead
# code checking, or unit tests fail. Integration tests (marked @pytest.mark.integration) are
# excluded here because they require credentials; run them separately in a
# secrets-aware workflow if needed.
#
# GitHub setup (one-time, to make CI actually block merges):
#   1. Push this file to your repo so the workflow runs at least once.
#   2. Go to Settings -> Branches -> Add branch protection rule.
#   3. Set the pattern to: main
#   4. Enable "Require status checks to pass before merging".
#   5. Search for and add each matrix "check" status: "check (ubuntu-latest,
#      <python>)" and "check (windows-latest, <python>)" for each Python
#      version in the matrix below, and, in the template repo itself, "template".
#   6. Optionally enable "Require branches to be up to date before merging".
#   7. Save the rule.
#
# Without branch protection, CI will still run and report pass/fail, but
# it will not prevent merging a failing PR.
#
# No customization is required for most projects. If you rename src/ or
# add test directories, update the mypy and pytest commands accordingly.
# =============================================================================
# </template-only>

# .github/workflows/ci.yml

name: CI
run-name: CI on ${{ github.ref_name }} ${{ github.event_name }} by @${{ github.actor }}

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.15"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}  # overrides .python-version for every uv command
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.13.x"

      # <template-only feature="private_repo_deps">
      - name: Mint a token for private git deps
        id: app-token
        if: ${{ vars.GH_APP_CLIENT_ID != '' }}
        # pin the app token action to a specific commit. list version commits:
        # git ls-remote --tags https://github.com/actions/create-github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: "" #FIXME github owner of private dependencies
          repositories: private-repo-1, private-repo-2 #FIXME list private dependencies

      - name: Authenticate git to private deps
        if: ${{ steps.app-token.outputs.token != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      # </template-only>

      - name: Sync dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Dead code (vulture)
        run: uv run vulture

      - name: Offline tests
        run: uv run pytest -m "not live"

  # <template-only>
  # The template's own self-check: every tracked file classified in
  # template.toml, markers balanced, features and tokens valid. The tool's
  # tests run in the check matrix above.
  # Then four projects made from the template (defaults, every feature off,
  # every feature on, a library) must each pass their own gates. Those tests
  # are marked live, because they download each project's dependencies, so the
  # check matrix skips them.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.13.x"

      - name: Validate the template
        run: uv run scripts/template_sync.py validate

      - name: Make sample projects and run their gates
        run: uv run pytest tests/test_template_manifest.py -m live --no-cov
  # </template-only>
