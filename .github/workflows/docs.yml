# <template-only>
# =============================================================================
# TEMPLATE SETUP NOTES -- template-only: scripts/template_sync.py never ships it
# =============================================================================
# This docs.yml is part of a starter repo scaffold.
#
# Purpose: Deploys the MkDocs site to GitHub Pages whenever docs/, mkdocs.yml,
# or src/ changes are pushed to main. The gh-deploy command pushes the built
# site to the gh-pages branch, which GitHub Pages serves automatically.
#
# Pre-requisite (one-time, in repo Settings -> Pages):
#   Set the source to "Deploy from a branch" and select the gh-pages branch.
# =============================================================================
# </template-only>

# .github/workflows/docs.yml

name: Docs
run-name: Docs on ${{ github.ref_name }} ${{ github.event_name }} by @${{ github.actor }}

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/**'

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.13.x"

      # <template-only feature="private_repo_deps">
      - name: Mint a token for private git deps
        id: app-token
        if: ${{ vars.GH_APP_CLIENT_ID != '' }}
        # pin the app token action to a specific commit. list version commits:
        # git ls-remote --tags https://github.com/actions/create-github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: "" #FIXME github owner of private dependencies
          repositories: private-repo-1, private-repo-2 #FIXME list private dependencies

      - name: Authenticate git to private deps
        if: ${{ steps.app-token.outputs.token != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      # </template-only>

      - name: Sync docs dependencies
        run: uv sync --locked --group docs

      - name: Deploy docs
        run: uv run mkdocs gh-deploy --force
