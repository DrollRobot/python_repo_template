# =============================================================================
# TEMPLATE SETUP NOTES -- remove this block when you use this template
# =============================================================================
# This docs.yml is part of python_repo_template, a starter repo scaffold.
#
# Purpose: Deploys the MkDocs site to GitHub Pages whenever docs/, mkdocs.yml,
# or src/ changes are pushed to main. The gh-deploy command pushes the built
# site to the gh-pages branch, which GitHub Pages serves automatically.
#
# Pre-requisite (one-time, in repo Settings -> Pages):
#   Set the source to "Deploy from a branch" and select the gh-pages branch.
# =============================================================================

# .github/workflows/docs.yml

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/**'              # if using mkdocstrings (below)

permissions:
  contents: write            # gh-deploy needs to push to gh-pages

concurrency:
  group: pages
  cancel-in-progress: false  # let an in-flight deploy finish

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.x"

      # FIXME uncomment if using Github app tokens to access private repos
      # - name: Mint a token for private git deps
      #   id: app-token
      #   # Best practice to use specific commit hashes of external dependencies
      #   # Find major tag commit hashes:
      #   # gh api repos/actions/create-github-app-token/tags --jq '.[] | "\(.name) \(.commit.sha)"
      #   uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      #   with:
      #     app-id: ${{ vars.GRAPH_AUTH_CLIENT_ID }}
      #     private-key: ${{ secrets.GRAPH_AUTH_APP_PRIVATE_KEY }}
      #     owner: ${{ github.repository_owner }}
      #     repositories: repo1, repo2

      # - name: Authenticate git to private deps
      #   run: |
      #     git config --global \
      #       url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf \
      #       "https://github.com/"

      - name: Sync docs dependencies
        run: uv sync --locked --group docs

      - name: Deploy docs
        run: uv run mkdocs gh-deploy --force
