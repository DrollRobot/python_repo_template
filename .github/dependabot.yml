# <template-only>
# =============================================================================
# TEMPLATE SETUP NOTES -- template-only: scripts/template_sync.py never ships it
# =============================================================================
# This dependabot.yml is part of a starter repo scaffold.
#
# Purpose: Dependabot is a GitHub service that automatically opens pull
# requests to bump outdated dependencies. With this config it runs weekly
# for two ecosystems:
#   - uv          -- Python package dependencies (uv.lock / pyproject.toml)
#   - github-actions -- .github/workflows action version pins
#
# Minor and patch updates in each ecosystem are grouped into a single PR per
# cycle so you get one review rather than one PR per package. Each major
# update gets its own PR, so one breaking change can't hold back the rest.
#
# To customize:
#   - Change interval to "monthly" if weekly PRs are too noisy.
#   - Adjust open-pull-requests-limit if you want more or fewer open at once.
#   - Add a target-branch key if your default branch is not "main".
# =============================================================================
# </template-only>

# .github/dependabot.yml

version: 2

# <template-only feature="private_repo_deps">
# FIXME uncomment if the project has private git dependencies
# (setup steps: docs/private-dependencies.md in the template)
# registries:
#   github-private:
#     type: git
#     url: https://github.com
#     username: x-access-token
#     password: ${{ secrets.DEPENDABOT_GIT_TOKEN }}
# </template-only>

updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # <template-only feature="private_repo_deps">
    # FIXME uncomment along with the registries block above
    # registries: [github-private]
    # </template-only>

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
