# =============================================================================
# TEMPLATE SETUP NOTES -- remove this block when you use this template
# =============================================================================
# This bug_report.yml is part of python_repo_template, a starter repo scaffold.
#
# Purpose: Defines a structured GitHub issue form for bug reports. GitHub
# renders this as a web form instead of a blank text box, which produces
# more complete and consistent reports.
#
# To customize:
#   - Update the version label ("python_repo_template version") to your package name.
#   - Replace the placeholder text in "Steps to reproduce" with a
#     relevant example from your own API.
#   - Do a find/replace on "DrollRobot" to substitute your GitHub username.
# =============================================================================

# .github/ISSUE_TEMPLATE/bug_report.yml

name: Bug report
description: Something is not working as documented or expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this report. Please search
        existing issues before opening a new one.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I call <function>() with ... it raises ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code snippet or steps that reproduce the issue.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: python_repo_template version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.14.3"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, tracebacks, or anything else relevant.
